[workspace]
members = ["terminusdb-community", "terminusdb-query-proof", "terminusdb-store-prolog", "terminusdb-dylib", "terminusdb-webserver", "terminusdb-vectorlink"]
# v2 required for per-platform dep features: v1 unifies them across all
# targets, leaking tikv-jemallocator/background_threads into macOS builds.
resolver = "2"

[profile.release]
# Line tables only — full debuginfo across the dep tree bloats CI builds and
# the shipped .so is stripped of it anyway (Dockerfile strip --strip-debug).
debug = 1

[patch.crates-io]
#tdb-succinct = {path="../../../tdb-succinct"}
# v0.2.1, what TerminusDB 12.1.0-rc3 pins and what the patched terminus-store
# fork now requires. The 0.2 line is not on crates.io, so this patch is what
# makes every `tdb-succinct = "0.2"` requirement in the graph resolve.
tdb-succinct = {git="https://github.com/terminusdb-org/tdb-succinct", tag="v0.2.1"}
#terminus-store = {path="../../../terminusdb-store"}
#terminus-store = {git="https://github.com/terminusdb-org/terminusdb-store"}
# The ParapluOU Proof-of-WOQL store fork. A git dependency, not the sibling
# path this used to be: a `../../../terminusdb-store-paraplu` path makes this
# workspace buildable only for someone who has that checkout beside it, and —
# because terminusdb-query-proof also pulls terminusdb-woql-proof, which
# depends on the same fork over git — a path here resolves to a SECOND copy of
# terminus-store, so a LayerCommitment from one is a different type to the
# other and the proof traits no longer unify. The spec below must stay
# character-identical to woql-proof's own (same URL, same branch) for cargo to
# treat them as one source. Local store edits therefore have to be pushed to
# that branch before this server picks them up.
terminus-store = {git="https://github.com/ParapluOU/terminusdb-store", branch="main"}
swipl = {git="https://github.com/terminusdb-org/swipl-rs"}
#swipl = {path="../../../swipl-rs/swipl"}

# Every dependency on the UPSTREAM store git source resolves to the proof fork
# too. terminusdb-grpc-labelstore-client depends on
# `git=".../terminusdb-org/terminusdb-store", tag="v0.23.1"` directly, so the
# [patch.crates-io] entry above does not reach it: without this, cargo builds a
# SECOND terminus-store and `GrpcLabelStore: LabelStore` no longer holds for the
# store this server actually uses. The fork's version tracks the upstream
# release (0.23.1), which is what makes it an acceptable replacement here.
[patch."https://github.com/terminusdb-org/terminusdb-store"]
terminus-store = {git="https://github.com/ParapluOU/terminusdb-store", branch="main"}

#[patch."https://github.com/terminusdb-org/tdb-succinct"]
#tdb-succinct = {path="../../../tdb-succinct"}

# To develop against a local vectorlink checkout instead of the pinned
# rev, uncomment:
#[patch."https://github.com/terminusdb-org/vectorlink"]
#vectorlink = {path="../../../vectorlink"}

[package]
name = "terminusdb-query-proof"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = []
blitzar-cpu = ["terminus-store/blitzar-cpu", "terminusdb-woql-proof/blitzar-cpu"]
blitzar-gpu = ["terminus-store/blitzar-gpu", "terminusdb-woql-proof/blitzar-gpu"]

[dependencies]
terminus-store = { version = "0.23.1", features = [] }
# terminusdb-rs by git, NOT by a `../../../../terminusdb-rs` path: a path that
# leaves this repository means the fork only builds on a machine that happens
# to have the sibling checked out at the right place, and a git dependency of
# this crate (which is how terminusdb-rs itself reaches the community crate)
# cannot resolve it at all. A workspace holding both checked out patches these
# back to the local copies, so in-tree edits still apply without a push — see
# terminusdb-rs's root manifest.
terminusdb-woql2 = { git = "https://github.com/ParapluOU/terminusdb-rs.git", rev = "98e9858bf939cc26ded907c0d088200d5e51b784" }
terminusdb-woql-proof = { git = "https://github.com/ParapluOU/terminusdb-rs.git", rev = "98e9858bf939cc26ded907c0d088200d5e51b784" }
terminusdb-schema = { git = "https://github.com/ParapluOU/terminusdb-rs.git", rev = "98e9858bf939cc26ded907c0d088200d5e51b784" }
serde_json = "1.0"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tdb-succinct = "0.2"

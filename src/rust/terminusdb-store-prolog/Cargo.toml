[package]
name = "terminusdb-store-prolog"
version = "0.2.0"
authors = ["Matthijs van Otterdijk <matthijs@terminusdb.com>", "Robin de Rooij <robin@terminusdb.com>", "Gavin Mendel-Gleason <gavin@terminusdb.com>"]
edition = "2018"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
rollup_metadata_experimental = ["terminus-store/rollup_metadata_experimental"]
query-proof = ["dep:terminusdb-query-proof"]
blitzar-cpu = ["query-proof", "terminus-store/blitzar-cpu", "terminusdb-query-proof/blitzar-cpu"]
blitzar-gpu = ["query-proof", "terminus-store/blitzar-gpu", "terminusdb-query-proof/blitzar-gpu"]

[dependencies]
swipl = {version="0.3.16", features=["serde"]}
#terminus-store = {version="0.21.5", features=[]}
#terminus-store = {path="../../../../terminusdb-store"}
terminus-store = {version="0.21.8", features=[]}
sha-1 = "0.9.1"
hex = "0.4.2"
encoding_rs = "0.8.24"
chardetng = "0.1.9"
urlencoding = "1.1.1"
chrono = "0.4"
rug = {version="1.16", default-features=false, features=["integer","rational"]}
base64 = "0.13"

terminusdb-grpc-labelstore-client = { git="https://github.com/terminusdb-labs/terminusdb-grpc-labelstore", rev="cb8cf29" }
tdb-succinct = "0.1.2"
# Explicit compile/prove/verify boundary; contains no scheduling policy.
terminusdb-query-proof = { path = "../terminusdb-query-proof", optional = true }

[dev-dependencies]
# Use the same fork instance as Terminus Store so ArkFr/ArkGT are one type graph.
dory-pcs = { path = "../../../../dory", default-features = false, features = ["arkworks"] }
